name: Refresh discovery catalog

on:
  schedule:
    # Daily refresh and gradual video expansion at 10:17 WIB (03:17 UTC).
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Run maintenance, a daily batch, collections, or the full weekly batch
        required: true
        default: maintenance
        type: choice
        options:
          - maintenance
          - daily
          - collections
          - weekly

permissions:
  contents: write

concurrency:
  group: nicevx-discovery-publication
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Select safe publication mode
        id: publication
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          mode="maintenance"
          ai_batch=0
          collection_ai_batch=0

          if [[ "$EVENT_NAME" == "schedule" && "$EVENT_SCHEDULE" == "17 3 * * *" ]]; then
            mode="daily"
            weekday="$(date -u +%u)"
            # Monday, Wednesday, and Friday publish two candidates; the other
            # days publish one. This keeps the established 10-video weekly cap.
            case "$weekday" in
              1|3|5) ai_batch=2 ;;
              *) ai_batch=1 ;;
            esac
            # Collection expansion remains deliberately limited to Monday.
            if [[ "$weekday" == "1" ]]; then
              collection_ai_batch=2
            fi
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_MODE" == "daily" ]]; then
            mode="daily"
            ai_batch=1
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_MODE" == "collections" ]]; then
            mode="collections"
            collection_ai_batch=2
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_MODE" == "weekly" ]]; then
            mode="weekly"
            ai_batch=10
            collection_ai_batch=2
          fi
          echo "ai_batch=$ai_batch" >> "$GITHUB_OUTPUT"
          echo "collection_ai_batch=$collection_ai_batch" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Require DeepSeek secret for catalog expansion
        if: steps.publication.outputs.ai_batch != '0' || steps.publication.outputs.collection_ai_batch != '0'
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [[ -z "$DEEPSEEK_API_KEY" ]]; then
            echo "DEEPSEEK_API_KEY is required for catalog expansion."
            exit 1
          fi

      - name: Refresh catalog and curate controlled candidates
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SITEMAP_AI_BATCH_SIZE: ${{ steps.publication.outputs.ai_batch }}
          COLLECTION_AI_BATCH_SIZE: ${{ steps.publication.outputs.collection_ai_batch }}
          SITEMAP_MAX_VIDEOS: "250"
          SITEMAP_REQUIRE_AI_CURATION: "true"
        run: npm run sitemap

      - name: Enforce catalog publication gates
        shell: bash
        run: |
          npm run test:workflow
          npm run test:copy
          npm run validate:collections
          node - <<'NODE'
          const catalog = require('./src/data/curated-video-catalog.json');
          const videos = Array.isArray(catalog.videos) ? catalog.videos : [];
          const ids = new Set(videos.map((video) => video.id));
          const urls = new Set(videos.map((video) => video.canonicalUrl));
          const invalid = videos.filter((video) =>
            !video.id || !video.canonicalUrl || !video.title || !video.description ||
            !video.sourceUrl || !video.embedUrl || !video.thumbnail ||
            Number.isNaN(Date.parse(video.uploadDate)) || video.availability !== 'available'
          );
          if (videos.length > 250) throw new Error(`Catalog hard limit exceeded: ${videos.length}/250`);
          if (ids.size !== videos.length) throw new Error('Duplicate video IDs detected');
          if (urls.size !== videos.length) throw new Error('Duplicate canonical URLs detected');
          if (invalid.length) throw new Error(`${invalid.length} catalog records failed required metadata gates`);
          console.log(`Catalog gate passed: ${videos.length}/250 verified videos`);
          NODE

      - name: Build before publication
        run: npm run build

      - name: Commit verified publication
        shell: bash
        env:
          PUBLICATION_MODE: ${{ steps.publication.outputs.mode }}
        run: |
          git config user.name "nicevx-discovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/sitemap.xml public/sitemaps src/data/ai-seo.json src/data/collections.json src/data/curated-video-catalog.json src/data/discovery-snapshots.json
          if git diff --cached --quiet; then
            echo "No factual catalog changes to publish."
            exit 0
          fi
          git commit -m "seo: ${PUBLICATION_MODE} discovery catalog refresh"
          git push origin HEAD:main
